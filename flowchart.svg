<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="100%" height="100%" style="background-color: #ffffff; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <!-- Canvas Border -->
  <rect width="940" height="340" fill="#ffffff" rx="12" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header Section -->
  <text x="40" y="42" font-size="15" font-weight="700" fill="#0f172a" letter-spacing="-0.3">Pipeline Arsitektur Sistem SAFER-Vest</text>
  <text x="40" y="60" font-size="12" fill="#64748b">Alur pemrosesan data sensor hingga inferensi otomatis status keselamatan relawan</text>

  <!-- Step 01: Sensor Data Stream -->
  <g filter="url(#subtle-shadow)">
    <rect x="40" y="90" width="155" height="185" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="52" y="102" width="26" height="20" rx="4" fill="#0f172a"/>
    <text x="65" y="116" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">01</text>
    <text x="86" y="116" font-size="12" font-weight="600" fill="#0f172a">Input Sensor</text>
    <line x1="52" y1="132" x2="183" y2="132" stroke="#e2e8f0" stroke-width="1"/>
    <text x="52" y="152" font-size="11" font-weight="600" fill="#334155">Detak Jantung</text>
    <text x="52" y="166" font-size="10" fill="#64748b">Biosensor BPM (60-187)</text>
    <text x="52" y="186" font-size="11" font-weight="600" fill="#334155">Gerak IMU</text>
    <text x="52" y="200" font-size="10" fill="#64748b">Moving / No Motion</text>
    <text x="52" y="220" font-size="11" font-weight="600" fill="#334155">Posisi GPS &amp; SOS</text>
    <text x="52" y="234" font-size="10" fill="#64748b">Lat, Lon &amp; Tombol Darurat</text>
    <rect x="52" y="248" width="131" height="16" rx="3" fill="#e2e8f0"/>
    <text x="117" y="260" font-size="9" font-weight="500" fill="#475569" text-anchor="middle">Interval: 12 Detik</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="195" y1="182" x2="225" y2="182" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 02: Preprocessing & Feature Engineering -->
  <g filter="url(#subtle-shadow)">
    <rect x="230" y="90" width="165" height="185" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="242" y="102" width="26" height="20" rx="4" fill="#0f172a"/>
    <text x="255" y="116" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">02</text>
    <text x="276" y="116" font-size="12" font-weight="600" fill="#0f172a">Rekayasa Fitur</text>
    <line x1="242" y1="132" x2="383" y2="132" stroke="#e2e8f0" stroke-width="1"/>
    <text x="242" y="152" font-size="11" font-weight="600" fill="#334155">Rolling Mean BPM</text>
    <text x="242" y="166" font-size="10" fill="#64748b">Tren lonjakan denyut nadi</text>
    <text x="242" y="186" font-size="11" font-weight="600" fill="#334155">Deviasi Jarak Spasial</text>
    <text x="242" y="200" font-size="10" fill="#64748b">Radius relatif posko pusat</text>
    <text x="242" y="220" font-size="11" font-weight="600" fill="#334155">Standarisasi Skala</text>
    <text x="242" y="234" font-size="10" fill="#64748b">Normalisasi data berjarak</text>
    <rect x="242" y="248" width="141" height="16" rx="3" fill="#e2e8f0"/>
    <text x="312" y="260" font-size="9" font-weight="500" fill="#475569" text-anchor="middle">Stratified Split 80:20</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="395" y1="182" x2="425" y2="182" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 03: Model Benchmarking -->
  <g filter="url(#subtle-shadow)">
    <rect x="430" y="90" width="165" height="185" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="442" y="102" width="26" height="20" rx="4" fill="#0f172a"/>
    <text x="455" y="116" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">03</text>
    <text x="476" y="116" font-size="12" font-weight="600" fill="#0f172a">Benchmarking ML</text>
    <line x1="442" y1="132" x2="583" y2="132" stroke="#e2e8f0" stroke-width="1"/>
    <text x="442" y="152" font-size="10" fill="#475569">Logistic Regression (96.4%)</text>
    <text x="442" y="170" font-size="10" fill="#475569">K-Nearest Neighbors (97.1%)</text>
    <text x="442" y="188" font-size="10" fill="#475569">Decision Tree (97.4%)</text>
    <text x="442" y="206" font-size="10" fill="#475569">Support Vector Machine (97.7%)</text>
    <text x="442" y="224" font-size="10" fill="#475569">Random Forest (97.8%)</text>
    <rect x="442" y="240" width="141" height="24" rx="4" fill="#0f172a"/>
    <text x="512" y="256" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">XGBoost (99.44%)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="595" y1="182" x2="625" y2="182" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 04: Champion Model Inference -->
  <g filter="url(#subtle-shadow)">
    <rect x="630" y="90" width="140" height="185" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="642" y="102" width="26" height="20" rx="4" fill="#0f172a"/>
    <text x="655" y="116" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">04</text>
    <text x="676" y="116" font-size="12" font-weight="600" fill="#0f172a">Model Terpilih</text>
    <line x1="642" y1="132" x2="758" y2="132" stroke="#e2e8f0" stroke-width="1"/>
    <text x="642" y="152" font-size="12" font-weight="700" fill="#0f172a">XGBoost</text>
    <text x="642" y="168" font-size="10" fill="#64748b">Akurasi: 99.44%</text>
    <text x="642" y="184" font-size="10" fill="#64748b">Presisi: 97.67%</text>
    <text x="642" y="200" font-size="10" fill="#64748b">Recall: 93.33%</text>
    <text x="642" y="216" font-size="10" fill="#64748b">F1 Score: 0.9545</text>
    <rect x="642" y="234" width="116" height="28" rx="4" fill="#f0fdf4" stroke="#86efac"/>
    <text x="700" y="252" font-size="10" font-weight="600" fill="#166534" text-anchor="middle">False Alarm: 1</text>
  </g>

  <!-- Branching Arrows 4 -> 5A & 5B -->
  <path d="M 770 150 L 795 150 L 795 130 L 805 130" fill="none" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <path d="M 770 214 L 795 214 L 795 234 L 805 234" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

  <!-- Step 05A: Status Bahaya (Top Branch) -->
  <g filter="url(#subtle-shadow)">
    <rect x="810" y="96" width="105" height="68" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
    <text x="822" y="116" font-size="11" font-weight="700" fill="#be123c">Kondisi Bahaya</text>
    <text x="822" y="132" font-size="9" fill="#881337">Buzzer Aktif</text>
    <text x="822" y="146" font-size="9" fill="#881337">Kirim GPS ke Posko</text>
  </g>

  <!-- Step 05B: Status Normal (Bottom Branch) -->
  <g filter="url(#subtle-shadow)">
    <rect x="810" y="200" width="105" height="68" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="822" y="220" font-size="11" font-weight="700" fill="#15803d">Kondisi Aman</text>
    <text x="822" y="236" font-size="9" fill="#14532d">Buzzer Nonaktif</text>
    <text x="822" y="250" font-size="9" fill="#14532d">Logging Telemetri</text>
  </g>

  <!-- Footer Legend -->
  <circle cx="45" cy="308" r="4" fill="#0f172a"/>
  <text x="55" y="312" font-size="11" fill="#64748b">Fase Pembelajaran Mesin (Model Training)</text>
  <circle cx="320" cy="308" r="4" fill="#10b981"/>
  <text x="330" y="312" font-size="11" fill="#64748b">Evaluasi &amp; Inferensi Aman</text>
  <circle cx="530" cy="308" r="4" fill="#f43f5e"/>
  <text x="540" y="312" font-size="11" fill="#64748b">Pemicu Peringatan Darurat Lapangan</text>
</svg>